plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'com.github.ben-manes.versions'
}

android {
    compileSdk androidCompileSdkVersion
    namespace "com.mikhaellopez.designsystem"
    defaultConfig {
        applicationId "com.mikhaellopez.pokecardcompose.designsystem"
        minSdk androidMinSdkVersion
        targetSdk androidTargetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion composeCompilerVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
    // Dependency Check Strategy
    tasks.named("dependencyUpdates").configure {
        rejectVersionIf { isNonStable(it.candidate.version) && !isNonStable(it.currentVersion) }
    }
}

ktlint {
    verbose = true
    android = true
}

dependencies {
    // MODULE
    implementation(project(':design:ui'))

    // KOTLIN
    implementation(kotlinStdlib)
    // ANDROIDX
    implementation(androidXAppCompat)
}