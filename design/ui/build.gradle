plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'com.github.ben-manes.versions'
}

android {
    compileSdk androidCompileSdkVersion
    namespace 'com.mikhaellopez.ui'
    defaultConfig {
        minSdk androidMinSdkVersion
        targetSdk androidTargetSdkVersion
        testInstrumentationRunner packageAndroidJUnitRunner
    }
    buildTypes {
        release {
            minifyEnabled true
        }
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion composeCompilerVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
    // Dependency Check Strategy
    tasks.named("dependencyUpdates").configure {
        rejectVersionIf { isNonStable(it.candidate.version) && !isNonStable(it.currentVersion) }
    }
}

ktlint {
    verbose = true
    android = true
}

dependencies {
    // MODULE
    implementation(project(':domain'))

    // KOTLIN
    implementation(kotlinStdlib)
    // ANDROIDX
    implementation(androidXAppCompat)
    // COMPOSE
    api(platform(composeBom))
    api(composeUI)
    debugApi(composeUiTooling)
    debugApi(customviewPoolingContainer)
    api(composeUiToolingPreview)
    api(composeFoundation)
    api(composeMaterial)
    api(composeMaterialIconsExt)
    api(activityCompose)
    implementation(accompanistSwiperefresh)
    implementation(coilCompose)
    // NAVIGATION
    api(navigationFragment)
    api(navigationUi)
}